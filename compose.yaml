name: orbis

x-app-env: &app-env
  ORBIS_DATABASE_URL: postgres://${ORBIS_POSTGRES_USER:-orbis}:${ORBIS_POSTGRES_PASSWORD:?Run node scripts/orbis.mjs init}@postgres:5432/${ORBIS_POSTGRES_DB:-orbis}?sslmode=disable
  ORBIS_REDIS_ADDR: redis:6379
  ORBIS_S3_ENDPOINT: http://rustfs:9000
  ORBIS_S3_ACCESS_KEY: ${ORBIS_S3_ACCESS_KEY:?Run node scripts/orbis.mjs init}
  ORBIS_S3_SECRET_KEY: ${ORBIS_S3_SECRET_KEY:?Run node scripts/orbis.mjs init}
  ORBIS_S3_BUCKET: ${ORBIS_S3_BUCKET:-orbis-docs}
  ORBIS_QDRANT_URL: http://qdrant:6333
  ORBIS_REQUIRE_RAG: "true"
  ORBIS_OTEL_ENDPOINT: ${ORBIS_OTEL_ENDPOINT:-}

x-backend: &backend
  image: orbis-backend:phase0
  build:
    context: .
    dockerfile: deployments/backend.Dockerfile
  init: true

services:
  postgres:
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${ORBIS_POSTGRES_USER:-orbis}
      POSTGRES_DB: ${ORBIS_POSTGRES_DB:-orbis}
      POSTGRES_PASSWORD: ${ORBIS_POSTGRES_PASSWORD:?Run init first}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1

  redis:
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: [redis-server, --appendonly, "yes", --maxmemory, 192mb, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    cpus: 0.5

  rustfs:
    image: ghcr.io/rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_ACCESS_KEY: ${ORBIS_S3_ACCESS_KEY:?Run init first}
      RUSTFS_SECRET_KEY: ${ORBIS_S3_SECRET_KEY:?Run init first}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
      RUSTFS_CORS_ALLOWED_ORIGINS: http://127.0.0.1:${ORBIS_WEB_PORT:-18080}
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: http://127.0.0.1:${ORBIS_S3_CONSOLE_PORT:-18901}
    command: [/data]
    volumes: [rustfs-data:/data]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/health]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    mem_limit: 768m
    cpus: 1

  qdrant:
    image: qdrant/qdrant@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    profiles: [rag]
    volumes: [qdrant-data:/qdrant/storage]
    healthcheck:
      test: [CMD, bash, -ec, 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; read -r line <&3; [[ "$$line" == *" 200 "* ]]']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1

  initialize:
    <<: *backend
    profiles: [app]
    command: [/app/migrate]
    environment:
      <<: *app-env
      ORBIS_ADMIN_USERNAME: ${ORBIS_ADMIN_USERNAME:-admin}
      ORBIS_ADMIN_PASSWORD: ${ORBIS_ADMIN_PASSWORD:?Run init first}
    depends_on:
      postgres: {condition: service_healthy}
      rustfs: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.5

  api:
    <<: *backend
    profiles: [app]
    command: [/app/server]
    environment: *app-env
    depends_on:
      initialize: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/verify, --health-url, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    cpus: 1

  worker:
    <<: *backend
    profiles: [app]
    command: [/app/worker]
    environment: *app-env
    depends_on:
      initialize: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/verify, --health-url, http://127.0.0.1:8081/readyz]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 192m
    cpus: 0.5

  frontend:
    image: orbis-frontend:phase0
    profiles: [app]
    build:
      context: .
      dockerfile: deployments/frontend.Dockerfile
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 384m
    cpus: 1

  proxy:
    image: nginx@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
    profiles: [app]
    ports: ["127.0.0.1:${ORBIS_WEB_PORT:-18080}:80"]
    volumes: [./deployments/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      api: {condition: service_healthy}
      frontend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 64m
    cpus: 0.5

  verify:
    <<: *backend
    profiles: [tools]
    command: [/app/verify]
    environment: *app-env
    mem_limit: 256m
    cpus: 1

  jaeger:
    image: jaegertracing/all-in-one@sha256:4fd2d70fa347d6a47e79fcb06b1c177e6079f92cba88b083153d56263082135e
    profiles: [obs]
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    mem_limit: 384m
    cpus: 0.5

  prometheus:
    image: prom/prometheus@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    profiles: [obs]
    volumes: [./deployments/prometheus.yaml:/etc/prometheus/prometheus.yml:ro, prometheus-data:/prometheus]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/healthy]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    cpus: 0.5

  grafana:
    image: grafana/grafana@sha256:a0f881232a6fb71a0554a47d0fe2203b6888fe77f4cefb7ea62bed7eb54e13c3
    profiles: [obs]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${ORBIS_GRAFANA_PASSWORD:?Run init first}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes: [grafana-data:/var/lib/grafana, ./deployments/grafana:/etc/grafana/provisioning:ro]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    cpus: 0.5

  ollama:
    image: ollama/ollama@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    profiles: [ollama]
    volumes: [ollama-data:/root/.ollama]
    mem_limit: ${ORBIS_OLLAMA_MEMORY:-2g}
    cpus: ${ORBIS_OLLAMA_CPUS:-2}

  searxng:
    image: searxng/searxng@sha256:eb2a404db174d33a04cd9f2e519bcae2ca722a58923510652cc1314be94e8e63
    profiles: [search]
    mem_limit: 256m
    cpus: 0.5

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
  qdrant-data:
  prometheus-data:
  grafana-data:
  ollama-data:
